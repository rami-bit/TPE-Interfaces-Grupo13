<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - CODEPLAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .home-placeholder {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 40px 16px;
        }

        .home-placeholder img {
            width: 120px;
            height: auto;
        }

        .home-placeholder h1 {
            color: var(--primario);
            font-size: 32px;
            margin: 0;
        }

        .home-placeholder p {
            color: var(--textoWhite);
            font-size: 14px;
            max-width: 420px;
            margin: 0;
        }

        .home-placeholder a {
            color: var(--primario);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--acento);
            padding-bottom: 2px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .home-placeholder a:hover {
            color: var(--primarioluz2);
            border-color: var(--primario);
        }
    </style>
</head>
<body>
    <main class="home-placeholder">
        <img src="assets/logo.svg" alt="Logo de CODEPLAY">
        <h1>¡Registro exitoso!</h1>
        <p>Este es el home de CODEPLAY. Placeholder temporal: reemplazá esta página con tu diseño del home.</p>
        <a href="game.html">Ir al juego</a>
    </main>
</body>
</html>
